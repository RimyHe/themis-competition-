[project]
name = "verified-testgen"
version = "0.1.0"
description = "Constraint-aware, execution-validated test generation for programming problems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "openai>=1.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling>=1.14.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verified_testgen", "themis"]

[tool.pytest.ini_options]
testpaths = ["verified_testgen/tests"]
python_files = ["test_*.py"]
